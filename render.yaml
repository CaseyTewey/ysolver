services:
  - type: web
    name: ysolver
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-render.txt && python deploy.py build
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMBA_NUM_THREADS
        value: "1"
      - key: NUMBA_CPU_NAME
        value: generic
      # Free services have no persistent disk. Server history is temporary;
      # the current game and Undo/Redo remain saved in each visitor's browser.
      - key: GAME_RESULTS_FILE
        value: /tmp/ysolver/game_results.json
