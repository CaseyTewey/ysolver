services:
  - type: web
    name: ysolver
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker so the 10 MB EV table is loaded once; threads serve concurrent requests.
    # 120 s timeout so an exact end-game distribution or a table rebuild is never killed mid-flight.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
